<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>মেস হিসাব</title>
<meta name="theme-color" content="#5E1224">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="মেস হিসাব">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#5E1224;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F3F4F7}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:#5E1224;color:#fff;font-family:system-ui,sans-serif;z-index:2;transition:opacity .3s}
  #splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 20px 40px -16px rgba(0,0,0,.6)}
  #splash b{font-size:22px;font-weight:600}
  #splash small{opacity:.75;font-size:14px;max-width:300px;text-align:center;line-height:1.5}
  #splash.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><b>মেস হিসাব</b><small id="msg">খুলছে…</small></div>
<script>
/* ===== এখানে আপনার Apps Script ওয়েব অ্যাপের লিংক বসান (…/exec দিয়ে শেষ) ===== */
const APP_URL = 'https://script.google.com/macros/s/AKfycbzw4ZM1SoAG4yNfcbSj4vubrCFknEttNRgCj81_I1OQ1y66Nvm_J9othe-04w9X4UVSLw/exec';

const msg = document.getElementById('msg'), splash = document.getElementById('splash');
if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) {
  msg.textContent = 'index.html ফাইলে APP_URL-এর জায়গায় আপনার ওয়েব অ্যাপের লিংক বসান।';
} else if (!navigator.onLine) {
  msg.textContent = 'ইন্টারনেট সংযোগ নেই — সংযোগ পেলে আবার খুলুন।';
  addEventListener('online', () => location.reload());
} else {
  const f = document.createElement('iframe');
  f.src = APP_URL;
  f.title = 'মেস হিসাব';
  f.allow = 'clipboard-read; clipboard-write; fullscreen';
  f.onload = () => setTimeout(() => splash.classList.add('hide'), 250);
  document.body.appendChild(f);
  setTimeout(() => splash.classList.add('hide'), 9000);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
